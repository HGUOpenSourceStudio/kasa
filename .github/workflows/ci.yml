name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm test -- --watchAll=false --passWithNoTests
      - run: node --test scripts/check-pr.test.mjs
